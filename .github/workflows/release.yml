name: release

# Запускается вручную: вкладка Actions → release → Run workflow, ввести тег (например v0.1.0).
# Собирает build/ и выкладывает его zip-архивом в раздел Releases.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить mingw32 (i686, msvcrt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-i686

      - name: Номер версии из тега
        run: |
          tag="${{ github.event.inputs.tag }}"
          full="${tag#v}"; ver="${full%%-*}"
          IFS=. read -r MA MI PA <<< "$ver"
          if ! [[ "$MA" =~ ^[0-9]+$ && "$MI" =~ ^[0-9]+$ && "$PA" =~ ^[0-9]+$ ]]; then echo "Тег должен быть вида vX.Y.Z (например v0.2.0), получено: $tag"; exit 1; fi
          printf '#ifndef VERSION_H\n#define VERSION_H\n#define SM_VER_MAJOR %s\n#define SM_VER_MINOR %s\n#define SM_VER_PATCH %s\n#define SM_VER_STR   "%s"\n#endif\n' "$MA" "$MI" "$PA" "$full" > src/version.h
          cat src/version.h

      - name: Собрать
        run: |
          mkdir -p build obj
          # RichEdit, иконки, шрифты и справка встраиваются в exe ресурсами (src/app.rc)
          i686-w64-mingw32-windres -Isrc -I. -O coff src/app.rc -o obj/app_res.o
          i686-w64-mingw32-gcc \
            -D_WIN32_WINNT=0x0400 -DWINVER=0x0400 -mwindows -O2 -Wall \
            -finput-charset=UTF-8 -fexec-charset=CP1251 \
            src/main.c src/printer.c src/preview.c obj/app_res.o \
            -o build/sm6337edit.exe \
            -lcomctl32 -lcomdlg32 -lgdi32 -lshell32

      - name: Упаковать версию со всеми файлами
        run: |
          mkdir -p full
          cp build/sm6337edit.exe full/
          cp redist/riched20.dll redist/riched32.dll redist/icons/toolbar.bmp redist/sm6337edit.hlp help/sm6337edit.cnt full/
          cp redist/fonts/*.ttf redist/fonts/OFL.txt full/
          cd full
          zip -r "../sm6337edit-full-${{ github.event.inputs.tag }}.zip" .

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "${{ github.event.inputs.tag }}" in *-*) pre="--prerelease";; esac
          gh release create "${{ github.event.inputs.tag }}" $pre \
            build/sm6337edit.exe \
            "sm6337edit-full-${{ github.event.inputs.tag }}.zip" \
            --title "SM6337 Edit ${{ github.event.inputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}"
